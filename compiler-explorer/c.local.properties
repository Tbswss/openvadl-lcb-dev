#
# custom compilers
# - one for the LCB generated compiler
# - four for riscv32 clang/lcb O0/O3 embench (they use the same exact flags as embench uses)
# - four for riscv64 clang/lcb O0/O3 embench (they use the same exact flags as embench uses)
# 
# the flags for the "embench compilers" are copied from the respective lcb-wrapper scripts and board.cfg files. these have to be kept in sync manually.
#
group.clang.compilers=lcb:emb-riscv32-O0-clang:emb-riscv32-O3-clang:emb-riscv32-O0-lcb:emb-riscv32-O3-lcb:emb-riscv64-O0-clang:emb-riscv64-O3-clang:emb-riscv64-O0-lcb:emb-riscv64-O3-lcb:upstream
group.clang.intelAsm=

# upstream
compiler.upstream.exe=clang
compiler.upstream.name=upstream

# lcb
compiler.lcb.exe=/src/llvm-final/build/bin/clang
compiler.lcb.name=LCB

# riscv32, upstream clang
compiler.emb-riscv32-O0-clang.exe=/src/llvm-final/build/bin/clang
compiler.emb-riscv32-O0-clang.name=embench riscv32 O0 clang
compiler.emb-riscv32-O0-clang.options=--target=riscv32 -march=rv32im -mabi=ilp32 -O0 -I/opt/riscv/riscv64-unknown-elf/include

compiler.emb-riscv32-O3-clang.exe=/src/llvm-final/build/bin/clang
compiler.emb-riscv32-O3-clang.name=embench riscv32 O3 clang
compiler.emb-riscv32-O3-clang.options=--target=riscv32 -march=rv32im -mabi=ilp32 -O3 -I/opt/riscv/riscv64-unknown-elf/include

# riscv32, LCB-generated
compiler.emb-riscv32-O0-lcb.exe=/src/llvm-final/build/bin/clang
compiler.emb-riscv32-O0-lcb.name=embench riscv32 O0 lcb
compiler.emb-riscv32-O0-lcb.options=--target=rv32im -D__SIZEOF_POINTER__=4 -D__riscv_xlen=32 -O0 -I/opt/riscv/riscv64-unknown-elf/include

compiler.emb-riscv32-O3-lcb.exe=/src/llvm-final/build/bin/clang
compiler.emb-riscv32-O3-lcb.name=embench riscv32 O3 lcb
compiler.emb-riscv32-O3-lcb.options=--target=rv32im -D__SIZEOF_POINTER__=4 -D__riscv_xlen=32 -O3 -mno-relax -I/opt/riscv/riscv64-unknown-elf/include

# riscv64, upstream clang
compiler.emb-riscv64-O0-clang.exe=/src/llvm-final/build/bin/clang
compiler.emb-riscv64-O0-clang.name=embench riscv64 O0 clang
compiler.emb-riscv64-O0-clang.options=--target=riscv64 -march=rv64im -mabi=lp64 -fPIC -O0 -I/opt/riscv/riscv64-unknown-elf/include

compiler.emb-riscv64-O3-clang.exe=/src/llvm-final/build/bin/clang
compiler.emb-riscv64-O3-clang.name=embench riscv64 O3 clang
compiler.emb-riscv64-O3-clang.options=--target=riscv64 -march=rv64im -mabi=lp64 -fPIC -O3 -I/opt/riscv/riscv64-unknown-elf/include

# riscv64, LCB-generated
compiler.emb-riscv64-O0-lcb.exe=/src/llvm-final/build/bin/clang
compiler.emb-riscv64-O0-lcb.name=embench riscv64 O0 lcb
compiler.emb-riscv64-O0-lcb.options=--target=rv64im -D__SIZEOF_POINTER__=8 -D__riscv_xlen=64 -O0 -fPIC -I/opt/riscv/riscv64-unknown-elf/include

compiler.emb-riscv64-O3-lcb.exe=/src/llvm-final/build/bin/clang
compiler.emb-riscv64-O3-lcb.name=embench riscv64 O3 lcb
compiler.emb-riscv64-O3-lcb.options=--target=rv64im -D__SIZEOF_POINTER__=8 -D__riscv_xlen=64 -O3 -mno-relax -fPIC -I/opt/riscv/riscv64-unknown-elf/include

#
#
# Default settings for C
#
#
compilers=&clang
defaultCompiler=cgdefault
demangler=c++filt
objdumper=objdump
postProcess=
supportsBinary=true
supportsBinaryObject=true
binaryHideFuncRe=^(__.*|_(init|start|fini)|(de)?register_tm_clones|call_gmon_start|frame_dummy|\.plt.*)$
stubRe=\bmain\b
stubText=int main(void){return 0;/*stub provided by Compiler Explorer*/}
supportsLibraryCodeFilter=true

#group.clang.compilers=cclang7:cclang8:cclang9:cclang10:cclang11:cclang12:cclangdefault:cclangccdefault


tools=clangquerydefault:clangtidydefault:readelf:nm:llvmdwarfdumpdefault

tools.clangquerydefault.exe=/usr/bin/clang-query
tools.clangquerydefault.name=clang-query (default)
tools.clangquerydefault.type=independent
tools.clangquerydefault.class=clang-query-tool
tools.clangquerydefault.stdinHint=Query commands
tools.clangquerydefault.monacoStdin=true

tools.clangtidydefault.exe=/usr/bin/clang-tidy
tools.clangtidydefault.name=clang-tidy (default)
tools.clangtidydefault.type=independent
tools.clangtidydefault.class=clang-tidy-tool
tools.clangtidydefault.stdinHint=disabled

tools.readelf.name=readelf (default)
tools.readelf.exe=/usr/bin/readelf
tools.readelf.type=postcompilation
tools.readelf.class=readelf-tool
tools.readelf.exclude=djggp
tools.readelf.stdinHint=disabled

tools.nm.name=nm (default)
tools.nm.exe=/usr/bin/nm
tools.nm.type=postcompilation
tools.nm.class=nm-tool
tools.nm.exclude=djggp
tools.nm.stdinHint=disabled

tools.llvmdwarfdumpdefault.exe=/usr/bin/llvm-dwarfdump
tools.llvmdwarfdumpdefault.name=llvm-dwarfdump (default)
tools.llvmdwarfdumpdefault.type=postcompilation
tools.llvmdwarfdumpdefault.class=llvm-dwarfdump-tool
tools.llvmdwarfdumpdefault.stdinHint=disabled


